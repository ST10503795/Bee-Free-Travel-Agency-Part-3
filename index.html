<!doctype html>
<!-- I tell the browser that this file uses HTML5. -->
<html lang="en">
  <!-- I set English as my website's main language. -->
  <head>
    <!-- I begin the information used to configure this page. -->
    <meta charset="UTF-8" />
    <!-- I allow the browser to display different text characters correctly. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- I make the page work on mobile screens. -->
    <meta http-equiv="refresh" content="0;url=CODE_STRUCTURE/Home.html" />
    <!-- I automatically open my actual Home page. -->
    <title>Bee Free Travel Agency</title>
    <!-- I give the browser tab a suitable title. -->
    <link rel="stylesheet" href="CSS_STYLE/STYLES.css" />
    <!-- I load the stylesheet using the correct path from the root folder. -->
  </head>
  <!-- I finish the page settings. -->
  <body>
    <!-- I begin the visible page content. -->
    <main class="wrap section center">
      <!-- I centre a fallback message for visitors whose browser does not redirect. -->
      <h1>Welcome to Bee Free Travel Agency</h1>
      <!-- I display the website's name. -->
      <p>Discover your next unforgettable journey.</p>
      <!-- I introduce the travel agency. -->
      <a class="btn btn-green" href="CODE_STRUCTURE/Home.html"
        >Open the website</a
      >
      <!-- I provide a working link if automatic redirection fails. -->
    </main>
    <!-- I finish the fallback content. -->
  </body>
  <!-- I finish the visible page. -->
</html>
<!-- I close the HTML document. -->
